<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>競馬分析システム - レース一覧</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; margin: 40px; color: #333; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .search-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .search-box input, .search-box select { padding: 8px; margin-right: 10px; border: 1px solid #ddd; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; cursor: pointer; }
        th { background-color: #1abc9c; color: white; }
        tr:hover { background-color: #f5f5f5; }
        .badge { background: #34495e; color: white; padding: 3px 8px; border-radius: 3px; font-size: 0.9em; }
        .sync-box { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; background: #fff; }
    </style>
</head>

<body>

    <div class="header-section">
        <h1>🐎 レース分析一覧</h1>
        <nav>
            <a href="/races">過去レース</a> | <a href="/shutuba">出馬予定</a>
        </nav>
    </div>

    <div class="sync-box">
        <h4>🏇 競馬データ手動同期</h4>
        <button id="runBatchBtn">今すぐ出馬表を取得（1週間分）</button>
        <span id="batchMessage" style="margin-left: 10px; font-weight: bold;"></span>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="レース名で検索..." onkeyup="filterTable()">
        <select id="locationSelect" onchange="filterTable()">
            <option value="">全開催場</option>
            <option value="東京">東京</option>
            <option value="中山">中山</option>
            <option value="京都">京都</option>
            <option value="阪神">阪神</option>
        </select>
    </div>

    <table id="raceTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">開催日 ↕</th>
                <th onclick="sortTable(1)">開催場 ↕</th>
                <th onclick="sortTable(2)">R ↕</th>
                <th onclick="sortTable(3)">レース名 ↕</th>
                <th>条件</th>
                <th>距離</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="race : ${races}">
                <td th:text="${race.raceDate}">2025-01-01</td>
                <td><span class="badge" th:text="${race.location}">東京</span></td>
                <td th:text="${race.raceNumber + 'R'}">11R</td>
                <td>
                    <a th:href="@{/races/{id}/results(id=${race.id})}" th:text="${race.raceName}" style="color: #009688; font-weight: bold;">レース名</a>
                </td>
                <td th:text="${race.trackType}">芝</td>
                <td th:text="${race.distance + 'm'}">1600m</td>
            </tr>
        </tbody>
    </table>

    <script>
        // テーブル検索機能
        function filterTable() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let loc = document.getElementById("locationSelect").value;
            let table = document.getElementById("raceTable");
            let tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let name = tr[i].getElementsByTagName("td")[3].innerText.toUpperCase();
                let location = tr[i].getElementsByTagName("td")[1].innerText;
                if (name.indexOf(input) > -1 && (loc === "" || location.indexOf(loc) > -1)) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }

        // テーブルソート機能
        function sortTable(n) {
            let table = document.getElementById("raceTable");
            let rows = Array.from(table.rows).slice(1);
            let dir = table.getAttribute("data-dir") === "asc" ? "desc" : "asc";
            table.setAttribute("data-dir", dir);

            rows.sort((a, b) => {
                let valA = a.cells[n].innerText.toLowerCase();
                let valB = b.cells[n].innerText.toLowerCase();
                return dir === "asc" ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });
            rows.forEach(row => table.tBodies[0].appendChild(row));
        }
    </script>
</body>
</html>
